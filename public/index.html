<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لعبة المافيا - لوحة المضيف</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-6 font-sans">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="text-center bg-gray-900 p-6 rounded-2xl border border-gray-800 shadow-xl">
            <h1 class="text-2xl font-black text-red-500">لعبة المافيا - لوحة المضيف</h1>
            <p id="gameStateText" class="text-sm text-gray-400 mt-1">الحالة: في انتظار انضمام اللاعبين...</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Config & Controls Panel -->
            <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800 space-y-4">
                <h2 class="text-lg font-bold text-yellow-500">إعدادات اللعبة</h2>
                <div id="configSection" class="space-y-3">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">عدد المافيا:</label>
                        <input type="number" id="mafiaCountInput" value="1" min="1" max="5" class="w-full bg-gray-950 border border-gray-800 rounded p-2 text-sm text-white">
                    </div>
                    <div class="space-y-2">
                        <label class="flex items-center space-x-2 space-x-reverse text-sm">
                            <input type="checkbox" id="includeDoctor" checked class="rounded bg-gray-950 border-gray-800 text-red-600">
                            <span>تفعيل الطبيب</span>
                        </label>
                        <label class="flex items-center space-x-2 space-x-reverse text-sm">
                            <input type="checkbox" id="includeMayor" checked class="rounded bg-gray-950 border-gray-800 text-red-600">
                            <span>تفعيل العمدة</span>
                        </label>
                        <label class="flex items-center space-x-2 space-x-reverse text-sm">
                            <input type="checkbox" id="includeDetective" checked class="rounded bg-gray-950 border-gray-800 text-red-600">
                            <span>تفعيل المحقق (برصاصة واحدة)</span>
                        </label>
                    </div>
                    <button onclick="startGame()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-xl transition text-sm">بدء اللعبة</button>
                </div>

                <div id="controlSection" class="space-y-2 pt-4 border-t border-gray-800 hidden">
                    <button onclick="socket.emit('start_discussion')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-xl text-sm">بدء مرحلة النقاش</button>
                    <button onclick="socket.emit('next_speaker')" class="w-full bg-gray-800 hover:bg-gray-700 text-white font-bold py-2 rounded-xl text-sm">المتحدث التالي</button>
                    <button onclick="socket.emit('start_voting')" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 rounded-xl text-sm">بدء التصويت الجماعي</button>
                </div>

                <button onclick="socket.emit('reset_to_lobby')" class="w-full bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold py-2 rounded-xl text-xs mt-4">إعادة ضبط اللعبة (للإستراحة)</button>
            </div>

            <!-- Connected Players Panel -->
            <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800 space-y-4">
                <h2 class="text-lg font-bold text-yellow-500">اللاعبون المتصلون (<span id="playerCount">0</span>)</h2>
                <div id="playersList" class="space-y-2 max-h-64 overflow-y-auto pr-1">
                    <!-- Populated dynamically -->
                </div>
                <div class="pt-4 border-t border-gray-800">
                    <h3 class="text-xs font-bold text-gray-400 mb-2">نتيجة المرحلة الحية:</h3>
                    <div id="liveResult" class="p-3 bg-gray-950 border border-gray-800 rounded-xl text-xs text-gray-300 min-h-[60px]">
                        في انتظار الأحداث...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();

        function startGame() {
            let mafiaCount = document.getElementById('mafiaCountInput').value;
            let includeDoctor = document.getElementById('includeDoctor').checked;
            let includeMayor = document.getElementById('includeMayor').checked;
            let includeDetective = document.getElementById('includeDetective').checked;
            socket.emit('start_game_config', { mafiaCount, includeDoctor, includeMayor, includeDetective });
        }

        socket.on('state_update', (data) => {
            document.getElementById('gameStateText').innerText = 'حالة اللعبة: ' + data.gameState;
            document.getElementById('playerCount').innerText = data.players.length;
            
            let configSec = document.getElementById('configSection');
            let controlSec = document.getElementById('controlSection');
            if (data.gameState === 'LOBBY') {
                configSec.classList.remove('hidden');
                controlSec.classList.add('hidden');
            } else {
                configSec.classList.add('hidden');
                controlSec.classList.remove('hidden');
            }

            let listHtml = '';
            data.players.forEach(p => {
                let statusBadge = p.isAlive ? '<span class="text-green-400 text-xs">في اللعبة</span>' : '<span class="text-red-500 text-xs">ميت</span>';
                if (!p.isConnected) statusBadge += ' <span class="text-yellow-500 text-xs">(منفصل)</span>';
                if (p.mayorRevealed) statusBadge += ' <span class="text-yellow-400 text-xs">(عمدة مكشوف)</span>';
                listHtml += `<div class="flex justify-between items-center p-2 bg-gray-950 rounded border border-gray-800 text-sm"><span>${p.name}</span> ${statusBadge}</div>`;
            });
            document.getElementById('playersList').innerHTML = listHtml;
        });

        socket.on('night_summary', (data) => {
            document.getElementById('liveResult').innerText = data.message;
        });

        socket.on('voting_summary', (data) => {
            document.getElementById('liveResult').innerText = data.message;
        });

        socket.on('announcement', (msg) => {
            document.getElementById('liveResult').innerText = msg;
        });
    </script>
</body>
</html>
