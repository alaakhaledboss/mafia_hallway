<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mafia Host Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-2xl space-y-6">
        
        <div class="flex justify-between items-center border-b border-gray-800 pb-4">
            <h1 class="text-xl font-black text-red-500 tracking-wider">MAFIA HOST DASHBOARD</h1>
            <span id="game-status" class="px-3 py-1 bg-red-950 text-red-400 text-xs font-bold rounded-full uppercase">LOBBY</span>
        </div>

        <div>
            <h2 class="text-xs font-bold text-gray-400 uppercase mb-2">Connected Players (<span id="player-count">0</span>)</h2>
            <div id="players-list" class="space-y-2 max-h-40 overflow-y-auto pr-1">
                <!-- Players injected here -->
            </div>
        </div>

        <div id="config-section" class="space-y-4 pt-4 border-t border-gray-800">
            <h2 class="text-xs font-bold text-red-400 uppercase">Game Rules Setup</h2>
            <div>
                <label class="block text-xs text-gray-400 mb-1">Number of Mafia:</label>
                <input type="number" id="mafia-count" min="1" value="1" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-red-500">
            </div>
            <div class="flex items-center space-x-2 space-x-reverse">
                <input type="checkbox" id="include-doctor" checked class="w-4 h-4 accent-red-500 rounded bg-gray-950 border-gray-800">
                <label for="include-doctor" class="text-sm text-gray-300">Include Doctor 🩺</label>
            </div>
            <button id="start-btn" class="w-full py-3 bg-red-600 hover:bg-red-700 font-bold rounded-xl text-sm transition shadow-lg shadow-red-900/30">
                Start Game & Assign Roles
            </button>
        </div>

        <!-- Day Flow Controls for Host -->
        <div id="day-controls" class="hidden space-y-3 pt-4 border-t border-gray-800">
            <h2 class="text-xs font-bold text-yellow-400 uppercase">Day Phase Controls</h2>
            <button id="start-discussion-btn" class="w-full py-2 bg-blue-600 hover:bg-blue-700 font-bold rounded-xl text-xs transition">
                Start Discussion (Pass the Mic) 🎤
            </button>
            <button id="start-voting-btn" class="w-full py-2 bg-purple-600 hover:bg-purple-700 font-bold rounded-xl text-xs transition">
                Start Daytime Voting ⚖️
            </button>
        </div>

        <div id="result-container" class="hidden pt-4 border-t border-gray-800 text-center">
            <span class="text-xs font-bold text-gray-400 uppercase">Live Phase Result</span>
            <div id="result-message" class="mt-2 text-sm text-yellow-400 font-semibold bg-gray-950 p-3 rounded-xl border border-gray-800"></div>
        </div>

    </div>

    <script>
        const socket = io();

        const gameStatus = document.getElementById('game-status');
        const playerCount = document.getElementById('player-count');
        const playersList = document.getElementById('players-list');
        const configSection = document.getElementById('config-section');
        const startBtn = document.getElementById('start-btn');
        const dayControls = document.getElementById('day-controls');
        const resultContainer = document.getElementById('result-container');
        const resultMessage = document.getElementById('result-message');

        socket.on('state_update', (data) => {
            gameStatus.textContent = data.gameState;
            playerCount.textContent = data.players.length;

            playersList.innerHTML = '';
            data.players.forEach(p => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center bg-gray-950 px-3 py-2 rounded-xl border border-gray-800 text-xs';
                div.innerHTML = `<span class="${p.isAlive ? '' : 'line-through text-gray-500'}">${p.name}</span> <span class="text-gray-500">${p.isAlive ? 'In Game' : 'Dead'}</span>`;
                playersList.appendChild(div);
            });

            // Disable configuration once game starts
            if (data.gameState !== 'LOBBY') {
                startBtn.disabled = true;
                startBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }

            // Show host day controls during night results or discussion
            if (data.gameState === 'NIGHT_RESULTS' || data.gameState === 'DAY_DISCUSSION') {
                dayControls.classList.remove('hidden');
            } else {
                dayControls.classList.add('hidden');
            }
        });

        startBtn.onclick = () => {
            const mafiaCount = document.getElementById('mafia-count').value;
            const includeDoctor = document.getElementById('include-doctor').checked;
            socket.emit('start_game_config', { mafiaCount, includeDoctor });
        };

        document.getElementById('start-discussion-btn').onclick = () => socket.emit('start_discussion');
        document.getElementById('start-voting-btn').onclick = () => socket.emit('start_voting');

        socket.on('night_summary', (data) => {
            resultContainer.classList.remove('hidden');
            resultMessage.textContent = data.message;
        });

        socket.on('voting_summary', (data) => {
            resultContainer.classList.remove('hidden');
            resultMessage.textContent = data.message;
        });
    </script>
</body>
</html>
